<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560" font-family="Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Preboarding flow for Next Project</title>
<desc id="d">Customer completes preboarding steps on the web. Done creates a ticket. BSO customer: ticket to technical support for a data export to the customer folder, then a ticket to Next PS for kickoff. New customer without BSO: ticket straight to Next PS. Development option: Aceve funnel to the right product and add-ons.</desc>
<defs>
<marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#457951"/></marker>
</defs>
<rect x="140" y="16" width="400" height="42" rx="8" fill="#FBFFF0" stroke="#92B97A"/>
<text x="340" y="42" text-anchor="middle" font-size="13" font-weight="bold" fill="#152F1A">New or BSO customer signs Aceve agreement</text>
<line x1="340" y1="58" x2="340" y2="82" stroke="#457951" stroke-width="2" marker-end="url(#arr)"/>
<rect x="40" y="86" width="600" height="150" rx="10" fill="#FBFFF0" stroke="#457951"/>
<rect x="40" y="86" width="600" height="28" rx="10" fill="#152F1A"/>
<rect x="40" y="100" width="600" height="14" fill="#152F1A"/>
<text x="58" y="105" font-size="13" font-weight="bold" fill="#FFFFFF">Preboarding: the customer does it themselves (web)</text>
<g font-size="12" font-weight="bold" fill="#152F1A">
<rect x="60" y="122" width="270" height="28" rx="6" fill="#E1FFAE" stroke="#92B97A"/><text x="195" y="140" text-anchor="middle">Company profile (industry, size, geography)</text>
<rect x="350" y="122" width="270" height="28" rx="6" fill="#E1FFAE" stroke="#92B97A"/><text x="485" y="140" text-anchor="middle">Superusers + roles</text>
<rect x="60" y="156" width="270" height="28" rx="6" fill="#E1FFAE" stroke="#92B97A"/><text x="195" y="174" text-anchor="middle">Webinars (Next Project)</text>
<rect x="350" y="156" width="270" height="28" rx="6" fill="#E1FFAE" stroke="#92B97A"/><text x="485" y="174" text-anchor="middle">Responsibility + AI consent</text>
<rect x="60" y="190" width="560" height="28" rx="6" fill="#E1FFAE" stroke="#92B97A"/><text x="340" y="208" text-anchor="middle">Prepare and upload  ·  BSO: clean projects + IT contact</text>
</g>
<line x1="340" y1="236" x2="340" y2="256" stroke="#457951" stroke-width="2" marker-end="url(#arr)"/>
<rect x="220" y="258" width="240" height="26" rx="13" fill="#152F1A"/>
<text x="340" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFFFFF">Done = ticket created at Aceve</text>
<line x1="320" y1="286" x2="190" y2="308" stroke="#457951" stroke-width="2" marker-end="url(#arr)"/>
<line x1="360" y1="286" x2="495" y2="308" stroke="#457951" stroke-width="2" marker-end="url(#arr)"/>
<text x="216" y="300" font-size="10" font-weight="bold" fill="#457951">BSO customer</text>
<text x="430" y="300" font-size="10" font-weight="bold" fill="#457951">New (no BSO)</text>
<rect x="40" y="310" width="290" height="56" rx="8" fill="#24462B"/>
<text x="185" y="332" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#FFFFFF">1 · Technical Support — data export</text>
<text x="185" y="350" text-anchor="middle" font-size="11" fill="#E1FFAE">placed in customer folder on SharePoint</text>
<rect x="350" y="310" width="290" height="56" rx="8" fill="#BDD78F" stroke="#457951"/>
<text x="495" y="335" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#152F1A">Next PS — kickoff meeting</text>
<text x="495" y="352" text-anchor="middle" font-size="11" fill="#24462B">directly, no export</text>
<line x1="185" y1="366" x2="185" y2="386" stroke="#457951" stroke-width="2" marker-end="url(#arr)"/>
<rect x="40" y="388" width="290" height="56" rx="8" fill="#BDD78F" stroke="#457951"/>
<text x="185" y="410" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#152F1A">2 · Next PS — kickoff meeting</text>
<text x="185" y="427" text-anchor="middle" font-size="11" fill="#24462B">data review (created automatically)</text>
<rect x="40" y="466" width="600" height="78" rx="10" fill="#F7FBF0" stroke="#92B97A" stroke-dasharray="6 4"/>
<text x="58" y="486" font-size="12" font-weight="bold" fill="#152F1A">Development option — widens scope beyond Next</text>
<text x="58" y="506" font-size="11.5" fill="#24462B">Aceve funnel: country + industry + size to the right product(s) (Next, Entré, Craftnote etc.).</text>
<text x="58" y="524" font-size="11.5" fill="#24462B">Add-ons per product (customer runs Next Project to list possible add-ons). Lead generation included.</text>
</svg>
