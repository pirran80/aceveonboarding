# Kopia av /home/ubuntu/docker/caddy-edge/conf.d/53-aceveonboarding.achiever.se.conf
# på produktionsservern (dokumentation — den aktiva filen är den på servern).
#
# Backend nås via containernamn på caddy_net, aldrig via host-port (hairpin-regeln).
# Let's Encrypt via HTTP-01: http-blocket släpper igenom ACME-utmaningen och
# omdirigerar allt annat till https, samma mönster som lingomaster.achiever.se.

# aceveonboarding.achiever.se — Aceve Onboard-portalen (Next.js, container aceveonboarding-app)
http://aceveonboarding.achiever.se {
    @notacme not path /.well-known/acme-challenge/*
    redir @notacme https://{host}{uri} 308
}

aceveonboarding.achiever.se {
    tls {
        ca https://acme-v02.api.letsencrypt.org/directory
    }

    encode gzip zstd

    reverse_proxy aceveonboarding-app:3000 {
        header_up Host {http.request.host}
        header_up X-Real-IP {remote}
    }

    @static path /_next/static/*
    header @static Cache-Control "public, max-age=31536000, immutable"

    header {
        X-Frame-Options DENY
        X-Content-Type-Options nosniff
        Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
        Referrer-Policy "strict-origin-when-cross-origin"
        -Server
    }
}
